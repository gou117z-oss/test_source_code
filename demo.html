<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TagInputBox デモ</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; padding: 40px; background: #f5f5f5; }
    table { border-collapse: collapse; background: #fff; }
    th, td { border: 1px solid #ccc; padding: 8px 12px; font-size: 14px; vertical-align: middle; }
    th { background: #f0f0f0; white-space: nowrap; }

    .tag-input-wrapper {
      position: relative;
      min-width: 300px;
    }
    .tag-input-box {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      min-height: 32px;
      padding: 3px 6px;
      border: 1px solid #aaa;
      border-radius: 3px;
      background: #fff;
      cursor: text;
      font-size: 14px;
    }
    .tag-input-box:focus-within {
      border-color: #4a90d9;
      box-shadow: 0 0 0 2px rgba(74,144,217,0.2);
    }
    .tag-selected {
      display: flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      min-width: 0;
      color: #333;
    }
    .tag-text {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .tag-remove {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      width: 16px;
      height: 16px;
      border: none;
      background: transparent;
      color: #333;
      font-size: 14px;
      cursor: pointer;
      border-radius: 2px;
    }
    .tag-remove:hover { background: rgba(0,0,0,0.1); }
    .tag-input-field {
      flex: 1;
      min-width: 60px;
      border: none;
      outline: none;
      padding: 2px 0;
      font-size: 14px;
      background: transparent;
    }
    .tag-dropdown {
      position: fixed;
      margin: 0; padding: 0;
      list-style: none;
      background: #fff;
      border: 1px solid #aaa;
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.15);
      z-index: 200;
      max-height: 240px;
      overflow-y: auto;
      display: none;
    }
    .tag-dropdown.open { display: block; }
    .tag-dropdown-item {
      padding: 8px 12px;
      font-size: 14px;
      color: #333;
      cursor: pointer;
      pointer-events: auto;
      user-select: none;
    }
    .tag-dropdown-item:hover,
    .tag-dropdown-item.focused { background: #4a90d9; color: #fff; }
  </style>
</head>
<body>

  <form name="search">
    <table>
      <tr>
        <th title="">ASP名</th>
        <td style="width:10%">
          <select name="users_accounts[tieup_ops]">
            <option value="">＝</option>
            <option value="not">以外</option>
            <option value="null">未入力</option>
            <option value="nnull">未入力以外</option>
          </select>
        </td>
        <td>
          <select id="users_accounts_tieup" name="users_accounts[tieup]">
            <option value=""> </option>
            <option value="sl0500c">スターラボ【V-TAG】初月無料500円docomo※チャット</option>
            <option value="sl0500ca">スターラボ【V-TAG】初月無料500円au※チャット</option>
            <option value="newin2000">新インサイト【ADinsight】2000円au[広告NG] </option>
            <option value="newin3000">新インサイト【ADinsight】3000円au[広告NG] </option>
            <option value="newin5000">新インサイト【ADinsight】5000円au[広告NG]</option>
            <option value="newin01000">新インサイト【ADinsight】初月無料1000円au[広告NG]</option>
            <option value="tapjoy7500">タップジョイ【Tapjoy】7日無料500円docomo</option>
            <option value="ev0_500_au">elvic【EV】初月無料500円au※LINE</option>
            <option value="ev2_500_docomo">elvic【EV】初月無料500円docomo※LINE</option>
            <option value="mimi7500d">mimi3【M3】7日無料500円docomo※LINE＠ </option>
            <option value="adcon500a">アクティブシーク【アドコンビニエンス】500円au</option>
          </select>
        </td>
      </tr>
    </table>
  </form>

  <script>
    function initTagInputFromSelect(selectEl) {
      if (selectEl.dataset.tagInputInitialized) return;
      selectEl.dataset.tagInputInitialized = "true";

      const options = Array.from(selectEl.options)
        .filter(o => o.value !== "")
        .map(o => ({ value: o.value, text: o.text.trim() }));

      const initialValue = selectEl.value;
      const state = {
        selected: options.filter(o => o.value === initialValue),
        inputValue: "",
        focusedIndex: -1,
        open: false,
      };

      selectEl.style.display = "none";

      const wrapper = document.createElement("div");
      wrapper.className = "tag-input-wrapper";

      const box = document.createElement("div");
      box.className = "tag-input-box";

      const input = document.createElement("input");
      input.className = "tag-input-field";
      input.placeholder = "検索...";
      box.appendChild(input);

      const dropdown = document.createElement("ul");
      dropdown.className = "tag-dropdown";

      wrapper.appendChild(box);
      wrapper.appendChild(dropdown);
      selectEl.parentNode.insertBefore(wrapper, selectEl);

      function getFiltered() {
        const vals = new Set(state.selected.map(s => s.value));
        return options.filter(o =>
          !vals.has(o.value) &&
          o.text.toLowerCase().includes(state.inputValue.toLowerCase())
        );
      }

      function syncSelect() {
        selectEl.value = state.selected.length > 0 ? state.selected[0].value : "";
      }

      function render() {
        Array.from(box.querySelectorAll(".tag-selected")).forEach(el => el.remove());

        if (state.selected.length > 0) {
          const opt = state.selected[0];
          const sel = document.createElement("span");
          sel.className = "tag-selected";

          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "tag-remove";
          btn.textContent = "×";
          btn.addEventListener("mousedown", e => {
            e.preventDefault();
            state.selected = [];
            render();
            input.focus();
          });
          sel.appendChild(btn);

          const span = document.createElement("span");
          span.className = "tag-text";
          span.textContent = opt.text;
          sel.appendChild(span);

          box.insertBefore(sel, input);
          input.style.display = "none";
        } else {
          input.style.display = "";
        }

        const filtered = getFiltered();
        dropdown.innerHTML = "";
        filtered.forEach((opt, idx) => {
          const li = document.createElement("li");
          li.className = "tag-dropdown-item" + (idx === state.focusedIndex ? " focused" : "");
          li.textContent = opt.text;
          li.addEventListener("pointerdown", e => {
            e.preventDefault(); // フォーカス移動を防ぎ、後続の mouse イベント生成も抑制
            state.selected = [opt];
            state.inputValue = "";
            state.focusedIndex = -1;
            state.open = false;
            input.value = "";
            render();
          });
          li.addEventListener("mouseenter", () => {
            state.focusedIndex = idx;
            Array.from(dropdown.querySelectorAll(".tag-dropdown-item")).forEach((item, i) => {
              item.classList.toggle("focused", i === idx);
            });
          });
          dropdown.appendChild(li);
        });

        dropdown.classList.toggle("open", state.open && filtered.length > 0);
        if (state.open && filtered.length > 0) positionDropdown();
        syncSelect();
      }

      function positionDropdown() {
        const rect = box.getBoundingClientRect();
        dropdown.style.top   = (rect.bottom + 2) + "px";
        dropdown.style.left  = rect.left + "px";
        dropdown.style.width = rect.width + "px";
      }

      window.addEventListener("scroll", positionDropdown, true);
      window.addEventListener("resize", positionDropdown);

      input.addEventListener("input", () => {
        state.inputValue = input.value;
        state.focusedIndex = -1;
        state.open = true;
        render();
      });

      input.addEventListener("focus", () => {
        if (state.selected.length > 0) return; // 選択済みのとき再オープンしない
        state.open = true;
        render();
      });

      input.addEventListener("keydown", e => {
        const filtered = getFiltered();
        if (e.key === "ArrowDown") {
          e.preventDefault();
          state.focusedIndex = Math.min(state.focusedIndex + 1, filtered.length - 1);
          state.open = true;
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          state.focusedIndex = Math.max(state.focusedIndex - 1, 0);
        } else if (e.key === "Enter" && state.focusedIndex >= 0) {
          e.preventDefault();
          state.selected = [filtered[state.focusedIndex]];
          state.inputValue = "";
          state.focusedIndex = -1;
          input.value = "";
          state.open = false;
        } else if (e.key === "Escape") {
          state.open = false;
          state.focusedIndex = -1;
        } else if (e.key === "Backspace" && state.inputValue === "" && state.selected.length > 0) {
          state.selected = [];
        }
        render();
      });

      box.addEventListener("click", () => {
        if (state.selected.length === 0) {
          input.focus();
          state.open = true;
          render();
        }
      });

      document.addEventListener("pointerdown", e => {
        const path = e.composedPath ? e.composedPath() : [];
        const inside = path.length > 0 ? path.includes(wrapper) : wrapper.contains(e.target);
        if (!inside) {
          state.open = false;
          state.focusedIndex = -1;
          render();
        }
      });

      render();
    }

    document.addEventListener("DOMContentLoaded", () => {
      initTagInputFromSelect(document.getElementById("users_accounts_tieup"));
    });
  </script>
</body>
</html>
