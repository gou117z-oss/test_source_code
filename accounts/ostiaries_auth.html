<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>着信認証</title>
</head>
<body>

  <!-- 入力フォーム -->
  <div id="form-area">
    <label for="phone">電話番号</label>
    <input type="tel" id="phone" placeholder="09012345678" />
    <button id="start-btn" type="button">認証開始</button>
    <p id="form-error" style="color:red; display:none"></p>
  </div>

  <!-- 認証中 -->
  <div id="auth-area" style="display:none">
    <p id="message"></p>
    <p id="dial-number" style="display:none">
      発信番号: <strong id="dial-number-value"></strong>
    </p>
    <button id="cancel-btn" type="button">キャンセル</button>
  </div>

  <script src="../ostiaries_auth.js"></script>
  <script>
    const formArea   = document.getElementById('form-area');
    const authArea   = document.getElementById('auth-area');
    const phoneInput = document.getElementById('phone');
    const startBtn   = document.getElementById('start-btn');
    const cancelBtn  = document.getElementById('cancel-btn');
    const formError  = document.getElementById('form-error');
    const message    = document.getElementById('message');
    const dialNumber = document.getElementById('dial-number');
    const dialValue  = document.getElementById('dial-number-value');

    let auth = null;

    startBtn.addEventListener('click', () => {
      const phone = phoneInput.value.trim();
      if (!phone) {
        formError.textContent = '電話番号を入力してください。';
        formError.style.display = '';
        return;
      }
      formError.style.display = 'none';
      startAuth(phone);
    });

    cancelBtn.addEventListener('click', () => {
      if (auth) auth.cancel();
    });

    function startAuth(phone) {
      formArea.style.display  = 'none';
      authArea.style.display  = '';
      dialNumber.style.display = 'none';
      message.textContent     = '認証を開始しています...';

      auth = new OstiariesAuth({
        endpoints: {
          start:  '/accounts/ostiaries_start.php',
          status: '/accounts/ostiaries_status.php',
          result: '/accounts/ostiaries_result.php',
          cancel: '/accounts/ostiaries_cancel.php',
        },
        customerNumbers: [phone],

        onDialNumber(number) {
          message.textContent      = '下記の番号へ電話してください。';
          dialValue.textContent    = number;
          dialNumber.style.display = '';
        },

        onStatusChange(status) {
          console.log('[status]', status);
        },

        onComplete(result) {
          dialNumber.style.display = 'none';
          cancelBtn.style.display  = 'none';
          message.textContent = result.auth_result === 'ok'
            ? '認証が完了しました。'
            : '番号が一致しませんでした。';
        },

        onFailed(status) {
          dialNumber.style.display = 'none';
          cancelBtn.style.display  = 'none';
          const labels = {
            failed:    '認証に失敗しました。',
            cancelled: 'キャンセルされました。',
            expired:   '認証がタイムアウトしました。',
          };
          message.textContent = labels[status] ?? '認証が終了しました。';
          showRetry();
        },

        onError(msg) {
          message.textContent = 'エラーが発生しました: ' + msg;
          console.error('[OstiariesAuth]', msg);
          showRetry();
        },
      });

      auth.start();
    }

    function showRetry() {
      cancelBtn.style.display = 'none';
      // フォームに戻れるボタンを表示
      const retryBtn = document.createElement('button');
      retryBtn.type = 'button';
      retryBtn.textContent = '戻る';
      retryBtn.addEventListener('click', () => {
        retryBtn.remove();
        cancelBtn.style.display = '';
        authArea.style.display  = 'none';
        formArea.style.display  = '';
      });
      authArea.appendChild(retryBtn);
    }
  </script>
</body>
</html>
